<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บันทึกการลงคุมแถว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fff; --card:#fff; --ink:#123524; --mute:#3d5c4b; --line:#c5e3d0; --brand:#17803f; --grad:linear-gradient(135deg,#157a3d,#2c9f5d); --ok:#177a43; --err:#c0392b; }
  * { box-sizing: border-box; }
  input, select, button, textarea { font-family: inherit; }
  body { margin:0; min-height:100vh; background:var(--bg) fixed; color:var(--ink); font-family: "Sarabun","Noto Sans Thai",Tahoma,sans-serif; line-height:1.5; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 1.4rem; margin: 8px 0 4px; }
  p.sub { margin: 0 0 18px; color: var(--mute); }
  form { background: var(--card); border:1px solid var(--line); border-radius: 14px; padding: 18px; }
  label { display:block; font-weight:600; margin: 14px 0 6px; }
  label:first-of-type { margin-top: 0; }
  input[type=text], input[type=date], select {
    width:100%; padding: 11px 12px; font: inherit; border:1px solid var(--line); border-radius: 10px; background:#fff; color: var(--ink);
  }
  input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  /* ช่องวันที่แสดงเป็น พ.ศ. (ช่องจริงโปร่งใสซ้อนทับอยู่ ใช้เปิดปฏิทิน) */
  .dwrap { position:relative; width:100%; }
  .dwrap .dpop { display:none; position:absolute; left:0; top:calc(100% + 6px); z-index:30; width:290px; max-width:calc(100vw - 32px); background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.18); padding:10px; color:var(--ink); }
  .dwrap .dpop.open { display:block; }
  .dwrap .dp-head { display:flex; align-items:center; gap:4px; margin-bottom:8px; }
  .dwrap .dp-title { flex:1; text-align:center; font-weight:700; }
  .dwrap .dp-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; }
  .dwrap .dp-dow { font-size:.8rem; color:var(--mute); font-weight:600; padding:4px 0; }
  .dwrap .dpop button { margin:0; width:auto; padding:0; font:inherit; border:0; background:none; color:var(--ink); cursor:pointer; border-radius:8px; opacity:1; }
  .dwrap .dp-head button { width:32px; height:32px; font-weight:700; color:var(--brand); font-size:1.1rem; }
  .dwrap .dp-grid button { height:34px; }
  .dwrap .dp-grid button:hover { background:#e1f5e8; }
  .dwrap .dp-grid button.today { outline:1.5px solid var(--brand); outline-offset:-1.5px; }
  .dwrap .dp-grid button.sel { background:var(--grad); color:#fff; font-weight:700; }
  .dwrap .dp-foot { display:flex; justify-content:center; margin-top:8px; }
  .dwrap .dp-foot button { padding:6px 16px; color:var(--brand); font-weight:700; border:1px solid var(--brand); }
  .dwrap .dshow { cursor:pointer; }
  .dwrap:focus-within .dshow { outline: 2px solid var(--brand); outline-offset: 1px; }
  input[type=file] { width:100%; font: inherit; }
  .lv-group { display:grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 10px; }
  .lv-btn { margin:0; width:auto; padding: 10px 0; font: inherit; font-weight:700; color: var(--brand); background:#fff; border:1.5px solid var(--line); border-radius: 10px; cursor:pointer; }
  .lv-btn.active { color:#fff; background: var(--grad); border-color: transparent; }
  .lv-btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  select:disabled { background:#f2f7f4; color: var(--mute); }
  .hint { font-size: .85rem; color: var(--mute); margin-top: 4px; }
  #preview { display:none; margin-top: 10px; max-width:100%; max-height: 280px; border-radius: 10px; border:1px solid var(--line); }
  button { margin-top: 20px; width:100%; padding: 13px; font: inherit; font-weight:700; color:#fff; background: var(--grad); border:0; border-radius: 10px; cursor:pointer; }
  button:disabled { opacity:.6; cursor: wait; }
  #status { margin-top: 14px; padding: 10px 12px; border-radius: 10px; display:none; font-size:.95rem; }
  #status.ok { display:block; background:#e8f6ee; color:var(--ok); }
  #status.err { display:block; background:#fdecea; color:var(--err); }
  #status.info { display:block; background:#e1f5e8; color:var(--brand); }
  a.link { display:inline-block; margin-top: 16px; color: #0f5c2e; }
  .school-bar, .head-bar { text-align:center; color: var(--ink); background: linear-gradient(90deg,#4cc16f 0%,#a9dc4f 50%,#ffe14d 100%); border-radius: 12px; }
  .school-bar { margin-top: 24px; padding: 14px 12px; font-weight:700; font-size:1.1rem; letter-spacing:.02em; }
  .head-bar { margin: 8px 0 18px; padding: 14px 12px; }
  .head-bar h1 { margin: 0 0 2px; }
  .head-bar p.sub { margin: 0; color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <div class="head-bar">
    <h1>บันทึกการลงคุมแถว</h1>
    <p class="sub">กรอกข้อมูลและแนบรูปภาพการลงคุมแถว</p>
  </div>

  <form id="f" novalidate>
    <label for="teacher">ชื่อครูที่ปรึกษา</label>
    <input type="text" id="teacher" maxlength="100" placeholder="เช่น นางสมศรี ใจดี" autocomplete="off" required>

    <label for="status_sel">สถานะ</label>
    <select id="status_sel" aria-label="สถานะ" required>
      <option value="ปฏิบัติราชการปกติ" selected>ปฏิบัติราชการปกติ</option>
      <option value="ไปราชการ">ไปราชการ</option>
      <option value="ลา">ลา</option>
    </select>

    <label id="lvLabel">ระดับชั้น</label>
    <div class="lv-group" id="lvGroup" role="group" aria-labelledby="lvLabel"></div>
    <select id="room" aria-label="ห้อง" required disabled>
      <option value="">— เลือกห้อง —</option>
    </select>

    <label for="date">วันที่</label>
    <input type="date" id="date" required>

    <label for="photo" id="photoLabel">รูปภาพการลงคุมแถว</label>
    <input type="file" id="photo" accept="image/*" required>
    <div class="hint">ระบบจะย่อรูปให้ไม่เกิน 1 MB อัตโนมัติก่อนส่ง</div>
    <img id="preview" alt="ตัวอย่างรูป">

    <button type="submit" id="submitBtn">ส่งข้อมูล</button>
    <div id="status" role="status"></div>
  </form>

  <a class="link" href="show.html">ดูรายการที่บันทึกแล้ว →</a>

  <div class="school-bar">โรงเรียนสระแก้ว</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const MAX_BYTES = 1 * 1024 * 1024; // ขนาดรูปสูงสุดที่ส่งไปบันทึก (1 MB)
  const LEVELS = [1, 2, 3, 4, 5, 6]; // ม.1–ม.6
  const ROOMS = 16;                  // ทุกระดับชั้นมี 16 ห้อง

  const $ = (id) => document.getElementById(id);
  const form = $('f'), teacher = $('teacher'), lvGroup = $('lvGroup'), room = $('room'),
        dateInput = $('date'), photo = $('photo'), preview = $('preview'),
        statusBox = $('status'), submitBtn = $('submitBtn'),
        statusSel = $('status_sel'), photoLabel = $('photoLabel');

  // เปลี่ยนข้อความหัวข้อไฟล์แนบตามสถานะ
  const PHOTO_LABEL_NORMAL = 'รูปภาพการลงคุมแถว';
  const PHOTO_LABEL_LEAVE = 'แนบใบไปราชการ / ใบลา';
  const isNormal = () => statusSel.value === 'ปฏิบัติราชการปกติ';
  function updatePhotoLabel() {
    photoLabel.textContent = isNormal() ? PHOTO_LABEL_NORMAL : PHOTO_LABEL_LEAVE;
  }
  statusSel.addEventListener('change', updatePhotoLabel);

  // สร้างปุ่มระดับชั้น ม.1–ม.6 และตัวเลือกห้อง 1–16
  let selectedLevel = '';
  for (const lv of LEVELS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'lv-btn';
    b.textContent = 'ม.' + lv;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => selectLevel(String(lv)));
    lvGroup.appendChild(b);
  }
  for (let r = 1; r <= ROOMS; r++) {
    const o = document.createElement('option');
    o.value = String(r);
    o.textContent = 'ห้อง ' + r;
    room.appendChild(o);
  }
  function selectLevel(lv) {
    selectedLevel = lv;
    [...lvGroup.children].forEach((b, i) => {
      const on = lv && String(LEVELS[i]) === lv;
      b.classList.toggle('active', !!on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    room.disabled = !lv;
  }

  // แสดงช่องวันที่เป็น วว/ดด/พ.ศ. (ค่าจริงที่บันทึกยังเป็น YYYY-MM-DD ค.ศ. เหมือนเดิม)
  function buddhistDate(input) {
    const wrap = document.createElement('div'); wrap.className = 'dwrap';
    const show = document.createElement('input');
    show.type = 'text'; show.readOnly = true; show.className = 'dshow'; show.autocomplete = 'off';
    show.placeholder = 'วว/ดด/ปปปป (พ.ศ.)'; show.setAttribute('aria-label', 'วันที่ (พ.ศ.)');
    input.before(wrap); wrap.append(show, input);
    const desc = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
    const upd = () => {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(desc.get.call(input));
      show.value = m ? `${m[3]}/${m[2]}/${+m[1] + 543}` : '';
    };
    Object.defineProperty(input, 'value', { get() { return desc.get.call(this); }, set(v) { desc.set.call(this, v); upd(); } });
    input.type = 'hidden'; // ช่องจริงเก็บค่า YYYY-MM-DD ส่วนการเลือกวันใช้ปฏิทิน พ.ศ. ด้านล่าง
    input.addEventListener('change', upd);

    const MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
    const DOW = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
    const p2 = (n) => String(n).padStart(2, '0');
    const parse = () => {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(desc.get.call(input));
      return m ? { y: +m[1], m: +m[2] - 1, d: +m[3] } : null;
    };
    const pop = document.createElement('div');
    pop.className = 'dpop'; pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-label', 'เลือกวันที่');
    wrap.append(pop);
    let vy = 0, vm = 0; // ปี (ค.ศ.) และเดือนที่กำลังดูในปฏิทิน

    function close() { pop.classList.remove('open'); }
    function choose(y, m, d) {
      desc.set.call(input, `${y}-${p2(m + 1)}-${p2(d)}`);
      upd();
      input.dispatchEvent(new Event('change', { bubbles: true }));
      close();
    }
    function btn(text, label, fn, cls) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = text;
      if (label) b.setAttribute('aria-label', label);
      if (cls) b.className = cls;
      b.addEventListener('click', (e) => { e.stopPropagation(); fn(); });
      return b;
    }
    function draw() {
      const sel = parse(), now = new Date();
      const first = new Date(vy, vm, 1).getDay(), days = new Date(vy, vm + 1, 0).getDate();
      const head = document.createElement('span'); head.className = 'dp-head';
      const title = document.createElement('span'); title.className = 'dp-title';
      title.textContent = `${MONTHS[vm]} ${vy + 543}`;
      head.append(
        btn('«', 'ปีก่อนหน้า', () => { vy--; draw(); }),
        btn('‹', 'เดือนก่อนหน้า', () => { if (--vm < 0) { vm = 11; vy--; } draw(); }),
        title,
        btn('›', 'เดือนถัดไป', () => { if (++vm > 11) { vm = 0; vy++; } draw(); }),
        btn('»', 'ปีถัดไป', () => { vy++; draw(); })
      );
      const grid = document.createElement('span'); grid.className = 'dp-grid';
      DOW.forEach((w) => { const s = document.createElement('span'); s.className = 'dp-dow'; s.textContent = w; grid.append(s); });
      for (let i = 0; i < first; i++) grid.append(document.createElement('span'));
      for (let d = 1; d <= days; d++) {
        const cls = [
          sel && sel.y === vy && sel.m === vm && sel.d === d ? 'sel' : '',
          now.getFullYear() === vy && now.getMonth() === vm && now.getDate() === d ? 'today' : ''
        ].join(' ').trim();
        grid.append(btn(String(d), '', () => choose(vy, vm, d), cls));
      }
      const foot = document.createElement('span'); foot.className = 'dp-foot';
      foot.append(btn('วันนี้', '', () => choose(now.getFullYear(), now.getMonth(), now.getDate())));
      pop.replaceChildren(head, grid, foot);
    }
    function open() {
      const s = parse() || { y: new Date().getFullYear(), m: new Date().getMonth() };
      vy = s.y; vm = s.m;
      draw();
      pop.style.left = '0'; pop.style.right = 'auto';
      pop.classList.add('open');
      if (pop.getBoundingClientRect().right > window.innerWidth - 8) { pop.style.left = 'auto'; pop.style.right = '0'; }
    }
    show.addEventListener('click', () => (pop.classList.contains('open') ? close() : open()));
    show.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
    });
    document.addEventListener('pointerdown', (e) => { if (!wrap.contains(e.target)) close(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
    upd();
  }
  buddhistDate(dateInput);

  // วันที่เริ่มต้น = วันนี้ (เวลาท้องถิ่นของเครื่อง)
  function setToday() {
    const d = new Date(), p = (n) => String(n).padStart(2, '0');
    dateInput.value = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }
  setToday();

  function showStatus(type, msg) {
    statusBox.className = type;
    statusBox.textContent = msg;
  }

  // ตัวอย่างรูป
  let previewUrl = null;
  photo.addEventListener('change', () => {
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    const f = photo.files[0];
    if (f && f.type.startsWith('image/')) {
      previewUrl = URL.createObjectURL(f);
      preview.src = previewUrl;
      preview.style.display = 'block';
    } else {
      preview.removeAttribute('src');
      preview.style.display = 'none';
    }
  });

  // ---------- เตรียมรูป: ย่อเป็น JPEG ไม่เกิน 1 MB ทุกครั้งก่อนส่ง ----------
  const bytesOfBase64 = (b64) =>
    Math.floor(b64.length * 3 / 4) - (b64.endsWith('==') ? 2 : b64.endsWith('=') ? 1 : 0);

  // หาแหล่งภาพที่วาดลง canvas ได้ (ลองรูปตัวอย่างก่อน เพราะใช้ได้บนมือถือมากที่สุด)
  async function getDrawable(file) {
    if (preview.getAttribute('src') && preview.complete && preview.naturalWidth) return preview;
    try { return await createImageBitmap(file); } catch (_) { /* ลองวิธีสำรอง */ }
    return await new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('เบราว์เซอร์อ่านรูปนี้ไม่ได้')); };
      img.src = url;
    });
  }

  // คืนค่า { base64, type, name } ของรูปที่ย่อแล้วและพร้อมส่ง
  async function prepareImage(file) {
    if (file.type && !file.type.startsWith('image/')) throw new Error('ไฟล์ที่แนบต้องเป็นรูปภาพ');

    let src;
    try {
      src = await getDrawable(file);
    } catch (e) {
      throw new Error('อ่านรูปไม่สำเร็จ (' + ((e && (e.name + ': ' + e.message)) || 'error') + ') กรุณาเลือกรูปจากแกลเลอรีหรือถ่ายรูปใหม่ แล้วลองอีกครั้ง');
    }

    const sw = src.naturalWidth || src.width, sh = src.naturalHeight || src.height;
    if (!sw || !sh) throw new Error('อ่านขนาดรูปไม่ได้ กรุณาเลือกรูปอื่น');

    let scale = Math.min(1, 1600 / Math.max(sw, sh));
    let quality = 0.8;
    for (let i = 0; i < 10; i++) {
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(sw * scale));
      c.height = Math.max(1, Math.round(sh * scale));
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; // กัน PNG พื้นโปร่งใสกลายเป็นพื้นดำ
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(src, 0, 0, c.width, c.height);
      const b64 = c.toDataURL('image/jpeg', quality).split(',')[1];
      if (b64 && bytesOfBase64(b64) <= MAX_BYTES) {
        return { base64: b64, type: 'image/jpeg', name: (file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg' };
      }
      quality = Math.max(0.5, quality - 0.1);
      scale *= 0.85;
    }
    throw new Error('ย่อรูปให้ไม่เกิน 1 MB ไม่สำเร็จ กรุณาเลือกรูปอื่น');
  }

  // ส่งรูปไป Apps Script -> ได้ fileId ของ Google Drive
  async function uploadToDrive(img) {
    const resp = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // เลี่ยง CORS preflight
      body: JSON.stringify({ base64: img.base64, type: img.type, name: img.name })
    });
    const data = await resp.json();
    if (!data.ok) throw new Error('อัปโหลดรูปไม่สำเร็จ: ' + (data.error || 'unknown'));
    return data.id;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = teacher.value.trim();
    const level = selectedLevel && room.value ? `ม.${selectedLevel}/${room.value}` : '';
    const date = dateInput.value;
    const file = photo.files[0];

    if (!name) return showStatus('err', 'กรุณากรอกชื่อครูที่ปรึกษา');
    if (!selectedLevel) return showStatus('err', 'กรุณาเลือกระดับชั้น (ม.1 – ม.6)');
    if (!room.value) return showStatus('err', 'กรุณาเลือกห้อง');
    if (!date) return showStatus('err', 'กรุณาเลือกวันที่');
    if (!file) return showStatus('err', isNormal() ? 'กรุณาแนบรูปภาพการลงคุมแถว' : 'กรุณาแนบใบไปราชการ / ใบลา');

    // ห้องเดียวกันส่งได้วันละครั้ง: รหัสเอกสาร = วันที่ + ห้อง (Firestore Rules ก็ตรวจรหัสนี้ซ้ำอีกชั้น)
    const docId = `${date}_${level.replace('/', '-')}`;
    const [dy, dm, dd] = date.split('-').map(Number);
    const dateTh = new Date(dy, dm - 1, dd).toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' });
    const dupMsg = `ห้อง ${level} ส่งข้อมูลการลงคุมแถวของวันที่ ${dateTh} แล้ว ไม่สามารถส่งซ้ำได้`;

    submitBtn.disabled = true;
    try {
      // ตรวจก่อนอัปโหลดรูป จะได้ไม่มีรูปค้างใน Drive (รวมถึงตรวจรายการเก่าที่บันทึกก่อนเพิ่มระบบนี้)
      showStatus('info', 'กำลังตรวจสอบข้อมูล...');
      const exist = await db.collection(COLLECTION).where('date', '==', date).where('classLevel', '==', level).limit(1).get();
      if (!exist.empty) throw new Error(dupMsg);

      showStatus('info', 'กำลังเตรียมรูปภาพ...');
      const ready = await prepareImage(file);

      showStatus('info', 'กำลังอัปโหลดรูป...');
      const imageId = await uploadToDrive(ready);

      showStatus('info', 'กำลังบันทึกข้อมูล...');
      try {
        await db.collection(COLLECTION).doc(docId).set({
          teacherName: name,
          status: statusSel.value,
          classLevel: level,
          date: date, // รูปแบบ YYYY-MM-DD
          imageId: imageId,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (err) {
        // ห้องนี้ถูกส่งไปก่อนแล้วระหว่างที่กำลังอัปโหลด (หรือส่งพร้อมกัน) → Rules ไม่อนุญาตให้เขียนทับ
        if (err && err.code === 'permission-denied') throw new Error(dupMsg + ' (หรือยังไม่ได้อัปเดต Firestore Rules)');
        throw err;
      }

      showStatus('ok', 'บันทึกเรียบร้อยแล้ว ขอบคุณครับ/ค่ะ');
      form.reset();
      updatePhotoLabel();
      selectLevel('');
      setToday();
      preview.removeAttribute('src');
      preview.style.display = 'none';
    } catch (err) {
      console.error(err);
      showStatus('err', err.message || 'เกิดข้อผิดพลาด กรุณาลองใหม่');
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
